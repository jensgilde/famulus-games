# Famulus Games v0.2.0 – Header-Version via env!("CARGO_PKG_VERSION")
# (Präferenz von Jens: Version im Build aus Cargo.toml, kein manuelles Setzen.)
#
# v0.2.0: UniFFI-Brücke für die native Swift-Hülle (swift-app/).
# Der Kern bleibt derselbe – die Brücke ist eine zusätzliche Schicht.

[workspace]
members = ["gui"]

[package]
name = "famulus-games-core"
version = "0.2.0"
edition = "2021"
description = "Famulus Games: vereinte Spiele-Bibliothek und Launcher über Steam und Heroic/GOG."

[lib]
name = "famulus_games"
path = "src/lib.rs"
# staticlib: damit die Swift-Hülle den Kern statisch einlinken kann.
crate-type = ["lib", "staticlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "5"
uniffi = { version = "0.29", features = ["cli"] }


[build-dependencies]
uniffi = { version = "0.29", features = ["build"] }

[dev-dependencies]

[profile.release]
lto = "fat"
codegen-units = 1
