# Famulus Games v0.1.0 – Header-Version via env!("CARGO_PKG_VERSION")
# (Präferenz von Jens: Version im Build aus Cargo.toml, kein manuelles Setzen.)

[workspace]
members = ["gui"]

[package]
name = "famulus-games-core"
version = "0.1.0"
edition = "2021"
description = "Famulus Games: vereinte Spiele-Bibliothek und Launcher über Steam und Heroic/GOG."

[lib]
name = "famulus_games"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "5"

[dev-dependencies]

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
