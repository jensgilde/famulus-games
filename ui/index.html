<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<title>Famulus Games</title>
<style>
  :root {
    font-family: "SF Mono", "JetBrains Mono", "Fira Code", "Cascadia Code", monospace;
    font-size: 13px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;

    --bg-primary: #000000; --bg-secondary: #080808; --bg-tertiary: #0d0d0d;
    --bg-hover: #141414; --bg-active: #1a1a1a; --bg-input: #0a0a0a;

    --text-primary: #e0e0e0; --text-secondary: #a0a0a0;
    --text-muted: #606060; --text-faint: #3a3a3a;

    /* Famulus-Markenfarbe: Gelb (Magenta ist rausgeflogen, 2026-08-27). */
    --accent: #FFC53D; --accent-hover: #FFD166;
    --accent-muted: rgba(255,197,61,0.12);

    --border: #1a1a1a; --border-hover: #2a2a2a;
    --danger: #ff4444;
    --radius: 6px; --radius-lg: 10px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg-primary); color: var(--text-primary);
         overflow: hidden; height: 100vh; width: 100vw; }
  #app { height: 100vh; display: flex; flex-direction: column; }

  /* ── Kopfzeile ── */
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    background: var(--bg-secondary);
    -webkit-app-region: drag; /* Fenster ziehen */
  }
  header .marke { font-weight: 700; font-size: 15px; letter-spacing: .5px; }
  header .marke .gelb { color: var(--accent); }
  header .suche { flex: 1; -webkit-app-region: no-drag; max-width: 340px; }
  header input {
    width: 100%; background: var(--bg-input); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 5px 10px; font: inherit; outline: none;
  }
  header input:focus { border-color: var(--accent); }
  .filter { display: flex; gap: 6px; -webkit-app-region: no-drag; }
  .chip {
    background: none; border: 1px solid var(--border); color: var(--text-muted);
    border-radius: 999px; padding: 3px 12px; font: inherit; cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.aktiv { border-color: var(--accent); color: var(--accent); background: var(--accent-muted); }
  .icon-btn {
    -webkit-app-region: no-drag;
    background: none; border: 1px solid var(--border); color: var(--text-muted);
    border-radius: var(--radius); width: 30px; height: 30px; cursor: pointer; font-size: 14px;
  }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ── Bibliothek ── */
  main { flex: 1; overflow-y: auto; padding: 20px 16px; }
  #netz {
    display: grid; gap: 18px;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
  }
  .karte {
    position: relative; border: 1px solid var(--border); border-radius: var(--radius-lg);
    overflow: hidden; background: var(--bg-secondary); cursor: pointer;
    transition: border-color .15s, transform .15s;
  }
  .karte:hover { border-color: var(--accent); transform: translateY(-2px); }
  .karte .huelse { aspect-ratio: 2 / 3; width: 100%; display: flex;
    align-items: center; justify-content: center; background: var(--bg-tertiary); }
  .karte img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .karte .platz { font-size: 42px; color: var(--text-faint); font-weight: 700; }
  .karte .info { padding: 8px 10px; border-top: 1px solid var(--border); }
  .karte .titel { font-size: 12px; font-weight: 600; color: var(--text-primary);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .karte .meta { display: flex; justify-content: space-between; margin-top: 3px; }
  .badge { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .8px; }
  .badge.gog { color: #b07aff; } .badge.steam { color: #66c0f4; }
  .karte .spielen {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.55); opacity: 0; transition: opacity .15s;
  }
  .karte:hover .spielen { opacity: 1; }
  .spielen span {
    background: var(--accent); color: #000; font-weight: 700;
    padding: 8px 20px; border-radius: var(--radius); font-size: 13px;
  }
  .karte.laeuft .spielen { opacity: 1; }
  .karte.laeuft .spielen span { background: var(--text-muted); color: #000; }

  #leer { text-align: center; color: var(--text-muted); padding: 80px 0; display: none; }
  #leer .gross { font-size: 22px; color: var(--accent); font-weight: 700; margin-bottom: 8px; }

  /* ── Fußzeile ── */
  footer {
    display: flex; justify-content: space-between; align-items: center;
    padding: 7px 16px; border-top: 1px solid var(--border);
    background: var(--bg-secondary); color: var(--text-muted); font-size: 11px;
  }
  #toast {
    position: fixed; bottom: 46px; left: 50%; transform: translateX(-50%);
    background: var(--bg-active); border: 1px solid var(--border-hover);
    color: var(--text-primary); padding: 7px 16px; border-radius: var(--radius);
    opacity: 0; transition: opacity .2s; pointer-events: none; font-size: 12px;
  }
  #toast.sichtbar { opacity: 1; }
  #toast.fehler { border-color: var(--danger); color: var(--danger); }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="marke">Famulus <span class="gelb">Games</span></div>
    <div class="suche"><input id="suchfeld" type="text" placeholder="Suchen…" /></div>
    <div class="filter">
      <button class="chip aktiv" data-quelle="alle">Alle</button>
      <button class="chip" data-quelle="Steam">Steam</button>
      <button class="chip" data-quelle="GOG">GOG</button>
    </div>
    <button class="icon-btn" id="aktualisieren" title="Bibliothek neu einlesen">↻</button>
  </header>

  <main>
    <div id="netz"></div>
    <div id="leer">
      <div class="gross">Keine Spiele gefunden</div>
      <div>Steam- und Heroic-Bibliotheken werden automatisch eingelesen.</div>
    </div>
  </main>

  <footer>
    <span id="zaehler">–</span>
    <span id="version">Famulus Games</span>
  </footer>
</div>
<div id="toast"></div>

<script>
let spiele = [];
let filterQuelle = "alle";

function toast(text, fehler) {
  const t = document.getElementById("toast");
  t.textContent = text;
  t.className = "sichtbar" + (fehler ? " fehler" : "");
  clearTimeout(t._zeit);
  t._zeit = setTimeout(() => t.className = "", 2600);
}

// Lokales Cover lesen oder URL-Cover in den Cache laden; Ergebnis ist
// eine Data-URL, die das Fenster direkt anzeigen darf.
async function coverAufloesen(spiel) {
  if (spiel.cover) {
    try { return await window.__TAURI__.core.invoke("cover_lokal", { pfad: spiel.cover }); }
    catch (e) { /* fällt durch zur URL */ }
  }
  if (spiel.cover_url) {
    try { return await window.__TAURI__.core.invoke("hole_cover",
      { spielId: spiel.id, url: spiel.cover_url }); }
    catch (e) { /* kein Cover – Platzhalter bleibt */ }
  }
  return null;
}

async function render() {
  const netz = document.getElementById("netz");
  const suchtext = document.getElementById("suchfeld").value.trim().toLowerCase();
  const sichtbar = spiele.filter(s =>
    (filterQuelle === "alle" || s.quelle === filterQuelle) &&
    (!suchtext || s.titel.toLowerCase().includes(suchtext)));

  netz.innerHTML = "";
  document.getElementById("leer").style.display = sichtbar.length ? "none" : "block";

  for (const spiel of sichtbar) {
    const karte = document.createElement("div");
    karte.className = "karte";

    const huelse = document.createElement("div");
    huelse.className = "huelse";
    const platz = document.createElement("div");
    platz.className = "platz";
    platz.textContent = spiel.titel.charAt(0).toUpperCase();
    huelse.appendChild(platz);

    // Cover asynchron nachladen – Karte steht sofort, Bild kommt nach.
    coverAufloesen(spiel).then(url => {
      if (!url) return;
      const img = document.createElement("img");
      img.src = url;
      img.onload = () => { huelse.innerHTML = ""; huelse.appendChild(img); };
    });

    const info = document.createElement("div");
    info.className = "info";
    const badgeFarbe = spiel.quelle === "GOG" ? "gog" : "steam";
    info.innerHTML =
      `<div class="titel"></div>
       <div class="meta">
         <span class="badge ${badgeFarbe}">${spiel.quelle}</span>
       </div>`;
    info.querySelector(".titel").textContent = spiel.titel;

    const overlay = document.createElement("div");
    overlay.className = "spielen";
    overlay.innerHTML = "<span>Spielen</span>";

    karte.onclick = async () => {
      if (karte.classList.contains("laeuft")) return;
      karte.classList.add("laeuft");
      overlay.querySelector("span").textContent = "Startet…";
      try {
        await window.__TAURI__.core.invoke("starte_spiel",
          { quelle: spiel.quelle, id: spiel.id, pfad: spiel.pfad });
        toast(`${spiel.titel} gestartet`);
      } catch (e) {
        toast(`Start fehlgeschlagen: ${e}`, true);
      } finally {
        setTimeout(() => {
          karte.classList.remove("laeuft");
          overlay.querySelector("span").textContent = "Spielen";
        }, 1500);
      }
    };

    karte.appendChild(huelse);
    karte.appendChild(info);
    karte.appendChild(overlay);
    netz.appendChild(karte);
  }

  document.getElementById("zaehler").textContent =
    `${sichtbar.length} von ${spiele.length} Spielen`;
}

async function ladeBibliothek() {
  try {
    spiele = await window.__TAURI__.core.invoke("bibliothek_laden");
  } catch (e) {
    spiele = [];
    toast("Bibliothek konnte nicht gelesen werden", true);
  }
  render();
}

document.getElementById("suchfeld").addEventListener("input", render);
document.getElementById("aktualisieren").addEventListener("click", ladeBibliothek);
document.querySelectorAll(".chip").forEach(chip => {
  chip.addEventListener("click", () => {
    document.querySelectorAll(".chip").forEach(c => c.classList.remove("aktiv"));
    chip.classList.add("aktiv");
    filterQuelle = chip.dataset.quelle;
    render();
  });
});

window.__TAURI__.core.invoke("app_version").then(v => {
  document.getElementById("version").textContent = `Famulus Games v${v}`;
}).catch(() => {});

ladeBibliothek();
</script>
</body>
</html>
