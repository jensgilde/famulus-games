# Famulus Games – XcodeGen-Projektdefinition v0.2.0.
# Erzeugt das Xcode-Projekt für die native SwiftUI-Hülle.
# Aufruf: `xcodegen generate` in diesem Ordner (macht scripts/build-app.sh).
name: FamulusGames

options:
  bundleIdPrefix: one.gilde
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  FamulusGames:
    type: application
    platform: macOS
    sources:
      - FamulusGames
      - Generated
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: one.gilde.famulus-games
        PRODUCT_NAME: Famulus Games
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Famulus Games
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        # Die App liest Steam-/Heroic-Ordner und startet Spiele per `open` –
        # das geht nur ohne Sandbox.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        # FFI: statische Rust-Bibliothek + UniFFI-Modul.
        LIBRARY_SEARCH_PATHS:
          - $(SRCROOT)/../target/release
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Generated
        OTHER_SWIFT_FLAGS:
          - -Xcc
          - -fmodule-map-file=$(SRCROOT)/Generated/famulus_gamesFFI.modulemap
        OTHER_LDFLAGS:
          - -lfamulus_games
