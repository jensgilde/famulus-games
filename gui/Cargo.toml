[package]
name = "famulus-games-gui"
version = "0.1.0"
edition = "2021"
description = "Famulus Games: grafische Oberfläche (Tauri 2) für die vereinte Spiele-Bibliothek."

[lib]
name = "famulus_games_gui"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
famulus-games-core = { path = ".." }

tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "5"
base64 = "0.22"
